apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
spec:
  metrics:
    - name: web-check
      provider:
        job:
          spec:
            template:
              spec:
                containers:
                  - name: curl-check
                    image: curlimages/curl
                    command: ["curl", "-f", "http://go-sample-app-svc:80"]
                restartPolicy: Never
            backoffLimit: 2
